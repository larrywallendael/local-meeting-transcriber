appId: com.localmeetingtranscriber.app
productName: LocalScribe
directories:
  output: dist-electron
files:
  - dist/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
  - "!**/tests/**"
  - "!**/test/**"
  - "!**/scripts/**"
  - "!**/reports/**"
  - "!**/test-audio/**"
  - "!**/.cursor/**"
  - "!**/release/**"
  - "!**/resources/**"
  - "!**/*.md"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - "whisper.exe"
      - "*.dll"
  - from: resources/models
    to: models
    filter:
      - "ggml-medium-q5_0.bin"
      - "ggml-small-q8_0.bin"
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - "ffmpeg.exe"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LocalScribe
  deleteAppDataOnUninstall: false
  include: build/nsis-custom.nsh
